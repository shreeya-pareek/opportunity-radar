[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-radar"
version = "0.1.0"
description = "A source-aware collector and tracker for study and career opportunities."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.34"]
test = ["pytest>=8", "httpx2"]

[project.scripts]
radar = "opportunity_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
